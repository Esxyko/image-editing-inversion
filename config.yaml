# Shared comparison settings. Use the same file for every method in a run.
model:
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  revision: "451f4fe16113bff5a5d2269ed5ad43b0592e9a14"
  width: 512
  height: 512

sampling:
  eta: 0.0
  seed: 42

prompt_to_prompt:
  # "auto" uses replacement for equal-length word sequences and refinement otherwise.
  mode: auto

# Add method-specific P2P settings under methods.<method_id>.prompt_to_prompt.
# The shared mode and fractions from pipeline_h_params still apply.
methods: {}

runtime:
  # Increased batches for a 32 GB VRAM GPU with headroom at 512x512.
  device: cuda
  dtype: float16
  batch_size: 4 # Source/target pairs per editing batch.
  inversion_batch_size: 8 # Source images per inversion batch; tune against Null-text peak memory.
  attention_query_chunk_size: 4096
  cpu_offload: none # "none", "model", or "sequential"
  vae_slicing: true
  vae_tiling: false
  num_workers: 4
  pin_memory: true
