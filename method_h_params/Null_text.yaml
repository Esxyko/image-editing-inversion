# Loaded once per invocation for inversion and artifact replay.
# These settings are independent of the shared experiment YAML.
# Pivots use inversion CFG; optimization, reconstruction and editing use editing CFG.
inversion_guidance_scale: 1.25
editing_guidance_scale: 7.5
num_inner_steps: 10
learning_rate: 0.01
early_stop_epsilon: 0.00001
epsilon_increment: 0.00002
